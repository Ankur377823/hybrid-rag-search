  <style>
/* ==========================================================================
   HybridRAG — Minimalist Clean Design System
   Simple, clean, monochrome aesthetic (no colorful distractions)
   ========================================================================== */

:root {
  --bg-base: #09090b;
  --bg-subtle: #121214;
  --bg-card: #18181b;
  --bg-card-hover: #202024;
  --bg-input: #09090b;

  --border-subtle: #27272a;
  --border-default: #3f3f46;
  --border-active: #71717a;

  --text-main: #f4f4f5;
  --text-muted: #a1a1aa;
  --text-dim: #71717a;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-base);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Base Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.5rem 0.9rem;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  text-decoration: none;
  white-space: nowrap;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-primary {
  background: #ffffff;
  color: #09090b;
  border-color: #ffffff;
  font-weight: 600;
}

.btn-primary:hover:not(:disabled) {
  background: #e4e4e7;
  border-color: #e4e4e7;
}

.btn-secondary, .btn-outline {
  background: #18181b;
  color: var(--text-main);
  border: 1px solid var(--border-subtle);
}

.btn-secondary:hover:not(:disabled), .btn-outline:hover:not(:disabled) {
  background: #27272a;
  border-color: var(--border-default);
}

.btn-danger-outline {
  background: transparent;
  color: #ef4444;
  border: 1px solid #3f3f46;
}

.btn-danger-outline:hover:not(:disabled) {
  background: rgba(239, 68, 68, 0.1);
  border-color: #ef4444;
}

.btn-sm {
  padding: 0.35rem 0.65rem;
  font-size: 0.8rem;
}

.btn-xs {
  padding: 0.25rem 0.5rem;
  font-size: 0.75rem;
}

.btn-md {
  padding: 0.6rem 1.15rem;
  font-size: 0.9rem;
}

.btn-block {
  width: 100%;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
}

/* Spinner */
.spinner-sm {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.spinner-md {
  display: inline-block;
  width: 22px;
  height: 22px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.spinner-lg {
  display: inline-block;
  width: 32px;
  height: 32px;
  border: 3px solid rgba(255, 255, 255, 0.2);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Alerts */
.alert-box {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
}

.alert-error {
  background: #18181b;
  border: 1px solid #7f1d1d;
  color: #fca5a5;
}

.alert-warning {
  background: #18181b;
  border: 1px solid #78350f;
  color: #fcd34d;
}

/* ==========================================================================
   Header Layout
   ========================================================================== */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 2rem;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
}

.brand-text-name {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-main);
}

.nav-segmented-control {
  display: flex;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 2px;
}

.nav-segment-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.4rem 1rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.nav-segment-btn:hover {
  color: var(--text-main);
}

.nav-segment-btn.active {
  background: var(--bg-card);
  color: var(--text-main);
}

.nav-count-badge {
  background: #27272a;
  color: var(--text-muted);
  font-size: 0.72rem;
  padding: 0.05rem 0.35rem;
  border-radius: 4px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.user-profile-menu {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  background: rgba(24, 24, 27, 0.7);
  border: 1px solid #27272a;
  border-radius: 8px;
  padding: 0.35rem 0.65rem 0.35rem 0.8rem;
  transition: border-color 0.15s ease;
}

.user-profile-menu:hover {
  border-color: #3f3f46;
}

.user-avatar-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a1a1aa;
}

.user-email-display {
  font-size: 0.8125rem;
  font-weight: 500;
  color: #e4e4e7;
  font-family: var(--font-sans);
}

.btn-signout {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #a1a1aa;
  font-size: 0.75rem;
  font-weight: 500;
  padding: 0.28rem 0.65rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-signout:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.18);
  color: #f4f4f5;
}

/* ==========================================================================
   Workspace Page (Documents & Query)
   ========================================================================== */
.workspace-page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2.5rem 2rem;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
}

.page-title {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.page-subtitle {
  font-size: 0.875rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
}

/* Document Grid & Cards */
.document-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 1rem;
}

.doc-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: border-color 0.15s ease;
}

.doc-card:hover {
  border-color: var(--border-default);
}

.doc-card-main {
  padding: 1.25rem;
}

.doc-name {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-main);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.doc-meta-line {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 0.4rem;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.meta-sep {
  color: var(--border-default);
}

.doc-actions-row {
  display: flex;
  gap: 0.5rem;
  padding: 0.75rem 1.25rem;
  background: var(--bg-subtle);
  border-top: 1px solid var(--border-subtle);
}

.doc-actions-row .btn {
  flex: 1;
}

/* Empty State */
.empty-state-panel {
  background: var(--bg-card);
  border: 1px dashed var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 4rem 2rem;
  text-align: center;
  max-width: 500px;
  margin: 3rem auto;
}

.empty-state-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.empty-state-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

/* ==========================================================================
   Query View
   ========================================================================== */
.query-layout-grid {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 1.5rem;
  align-items: start;
}

.query-main-panel {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.query-input-card {
  padding: 1.25rem;
}

.scope-selector-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.scope-label {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.select-control {
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  padding: 0.35rem 0.65rem;
  border-radius: var(--radius-sm);
  font-size: 0.825rem;
  outline: none;
}

.select-control:focus {
  border-color: var(--border-default);
}

.query-textarea {
  width: 100%;
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.75rem;
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  resize: vertical;
  min-height: 80px;
  outline: none;
}

.query-textarea:focus {
  border-color: var(--border-default);
}

.query-submit-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.75rem;
  gap: 1rem;
}

.sample-prompts-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.sample-label {
  font-size: 0.75rem;
  color: var(--text-dim);
}

.sample-prompt-chip {
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  font-size: 0.75rem;
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}

.sample-prompt-chip:hover {
  background: #27272a;
  color: var(--text-main);
}

.query-loading-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.5rem;
}

.loading-bold {
  font-size: 0.9rem;
  font-weight: 500;
}

.loading-sub {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 0.2rem;
}

/* Answer Container */
.answer-container {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.answer-card {
  padding: 1.5rem;
}

.answer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 0.75rem;
}

.answer-badge-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.badge-primary {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-main);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.badge-neutral {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-dim);
}

.answer-body-prose {
  font-size: 0.95rem;
  line-height: 1.65;
  color: #e4e4e7;
  white-space: pre-wrap;
}

.citation-ref-badge {
  color: #ffffff;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

.answer-metrics-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border-subtle);
}

.metric-gauge-cell {
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.65rem 0.75rem;
}

.metric-gauge-label {
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
}

.metric-gauge-value {
  font-size: 1rem;
  font-weight: 600;
  margin-top: 0.2rem;
}

.metric-gauge-bar {
  height: 3px;
  background: #27272a;
  border-radius: 2px;
  margin-top: 0.4rem;
  overflow: hidden;
}

.metric-gauge-fill {
  height: 100%;
  background: #ffffff;
}

.metric-gauge-sub {
  font-size: 0.68rem;
  color: var(--text-dim);
  margin-top: 0.2rem;
}

/* Citations Card */
.citations-card {
  padding: 1.25rem;
}

.citations-header {
  margin-bottom: 1rem;
}

.citations-title {
  font-size: 0.9rem;
  font-weight: 600;
}

.citations-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.citation-item {
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.85rem;
  display: flex;
  gap: 0.75rem;
}

.citation-marker {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
}

.citation-details {
  flex: 1;
}

.citation-source-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.35rem;
}

.citation-doc-name {
  font-size: 0.8rem;
  font-weight: 600;
}

.citation-chunk-tag {
  font-size: 0.72rem;
  color: var(--text-dim);
}

.citation-content-quote {
  font-size: 0.825rem;
  color: var(--text-muted);
  line-height: 1.45;
}

/* Sidebar Analytics */
.query-sidebar {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.sidebar-card {
  padding: 1.25rem;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.85rem;
}

.sidebar-title {
  font-size: 0.85rem;
  font-weight: 600;
}

.badge-subtle {
  font-size: 0.7rem;
  color: var(--text-dim);
}

.telemetry-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
}

.telemetry-cell {
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.65rem;
}

.telemetry-label {
  font-size: 0.7rem;
  color: var(--text-dim);
}

.telemetry-number {
  font-size: 1.1rem;
  font-weight: 600;
  margin-top: 0.15rem;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-height: 380px;
  overflow-y: auto;
}

.history-empty {
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 0.5rem 0;
}

.history-item {
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.6rem 0.75rem;
  cursor: pointer;
  transition: border-color 0.15s;
}

.history-item:hover {
  border-color: var(--border-default);
}

.history-q-text {
  font-size: 0.8rem;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.35rem;
  font-size: 0.72rem;
  color: var(--text-dim);
}

.history-badge {
  font-size: 0.68rem;
  color: var(--text-muted);
}

/* ==========================================================================
   Modals
   ========================================================================== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}

.modal-dialog {
  background: var(--bg-card);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  width: 100%;
  max-width: 520px;
  overflow: hidden;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border-subtle);
}

.modal-header-info {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.modal-icon-badge {
  display: none;
}

.modal-title {
  font-size: 1rem;
  font-weight: 600;
}

.modal-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 0.15rem;
}

.modal-close-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0.35rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close-btn:hover {
  color: var(--text-main);
}

.modal-body {
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.dropzone {
  border: 1px dashed var(--border-default);
  border-radius: var(--radius-sm);
  background: var(--bg-base);
  padding: 2.5rem 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s;
}

.dropzone:hover, .dropzone-active {
  border-color: #ffffff;
}

.file-input-hidden {
  display: none;
}

.dropzone-icon-circle {
  color: var(--text-muted);
  margin-bottom: 0.75rem;
}

.dropzone-primary-text {
  font-size: 0.875rem;
  color: var(--text-main);
}

.dropzone-browse {
  text-decoration: underline;
  cursor: pointer;
}

.dropzone-secondary-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 0.35rem;
}

.dropzone-filename {
  font-size: 0.95rem;
  font-weight: 600;
}

.dropzone-filesize {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 0.25rem;
}

.zero-downtime-note {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  color: var(--text-dim);
  background: var(--bg-base);
  padding: 0.65rem 0.85rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}

.stepper-card {
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 1rem;
}

.stepper-header-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  margin-bottom: 0.5rem;
}

.progress-bar-track {
  height: 4px;
  background: #27272a;
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 0.75rem;
}

.progress-bar-fill {
  height: 100%;
  background: #ffffff;
  transition: width 0.2s ease;
}

.stepper-stage-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.68rem;
  color: var(--text-dim);
}

.stepper-stage-labels .stage-done {
  color: var(--text-main);
  font-weight: 500;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 0.75rem;
  padding: 1rem 1.5rem;
  background: var(--bg-subtle);
  border-top: 1px solid var(--border-subtle);
}

/* ==========================================================================
   Auth / Login Gate
   ========================================================================== */
.auth-viewport {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg-base);
  padding: 2rem;
}

.auth-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 3rem;
}

.brand-monogram {
  display: flex;
